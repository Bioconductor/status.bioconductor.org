name: Scheduled checks
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash
concurrency:
  group: "webchecks"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Step `if:` conditions cannot read secrets
    env:
      SLACK_ENABLED: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Check site accessibility and push results
        id: check
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 20
          shell: bash
          command: |
            set -x

            # Clear notification state left by a previous retry attempt
            rm -f /tmp/webcheckflag-* /tmp/webchecknotify-msg /tmp/webchecknotify-msg-*

            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name github-actions
            git config user.email github-actions@github.com
            git pull origin main || git reset --hard origin/main

            # <system> (last argument) must exactly match a `name` under `systems:` in config.yml (see docs/checks.md)
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'http://bioconductor.org' '(Auto-detected) Bioconductor Main Site Down' 'disrupted' 'Main site'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'http://workshop.bioconductor.org' '(Auto-detected) Bioconductor Workshop Service Down' 'disrupted' 'Workshop Service'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'http://slack.bioconductor.org' '(Auto-detected) Slack Invite App Down' 'disrupted' 'Slack app'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'https://mghp.osn.xsede.org/bir190004-bucket01/archive.bioconductor.org/packages/3.17/index.html' '(Auto-detected) Bioconductor Archive Down' 'disrupted' 'Archive'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'https://mghp.osn.xsede.org/bir190004-bucket01/ExperimentHub/BioImageDbs/v02/EM_id0005_Mouse_Kidney_2D_All_Mito_1024_4dTensor_dataset.gif' '(Auto-detected) Bioconductor ExperimentHub Resource Endpoint Down' 'disrupted' 'ExperimentHub'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'https://mghp.osn.xsede.org/bir190004-bucket01/AnnotationHub/goldenpath' '(Auto-detected) Bioconductor AnnotationHub Resource Endpoint Down' 'disrupted' 'AnnotationHub'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'https://code.bioconductor.org/browse/' '(Auto-detected) Bioconductor Code Browser Down' 'disrupted' 'Bioconductor Code Browser'
            bash .github/scripts/web_check_and_report.sh 'webcheck' 'https://code.bioconductor.org/search/' '(Auto-detected) Bioconductor Code Search Down' 'disrupted' 'Bioconductor Code Search'
            bash .github/scripts/web_check_and_report.sh 'statscheck' 'https://bioconductor.org/packages/stats/bioc/' '(Auto-detected) Bioconductor Package Stats Failed Check' 'disrupted' 'Package Stats'
            
            git commit -m "Update website checks $(date '+%Y-%m-%d-%H-%M-%S')"
            git push

            # Delete only the flags; webchecknotify-msg must survive for the Slack step
            if ls /tmp/webcheckflag-* > /dev/null 2>&1; then
              echo notify='yes' >> $GITHUB_OUTPUT
              rm -f /tmp/webcheckflag-*
            fi

      - name: Build Slack payload
        if: steps.check.outputs.notify == 'yes' && env.SLACK_ENABLED == 'true'
        env:
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          MSG=$(cat /tmp/webchecknotify-msg 2>/dev/null || true)
          [ -n "$MSG" ] || MSG="(no detail captured - check the run log)"
          jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "At least one webcheck has changed."$'\n'"$MSG" \
            '{channel: $channel, text: $text}' > "$RUNNER_TEMP/slack-payload.json"
          rm -f /tmp/webchecknotify-msg /tmp/webchecknotify-msg-*

      # Payload file rather than inline YAML because the message is multi-line
      - name: Notify slack channel
        if: steps.check.outputs.notify == 'yes' && env.SLACK_ENABLED == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack-payload.json
        continue-on-error: true
